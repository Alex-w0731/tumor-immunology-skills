name: Citations

# Resolves every DOI and PMID cited by the skills against Crossref and PubMed and compares
# year, first author and title with the entry. Network-dependent, so it is kept out of CI.
# It runs when a bibliography changes and on demand. To also run it weekly, uncomment:
#   schedule:
#     - cron: "17 4 * * 1"   # Mondays 04:17 UTC
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/*/references/sources.md"
      - "tools/check_citations.py"

permissions:
  contents: read

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_citations.py
