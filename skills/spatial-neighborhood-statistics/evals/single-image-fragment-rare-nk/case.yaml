schema_version: "1.1"
name: single-image-fragment-rare-nk
expected_outcome: |
  The agent runs a label-permutation neighbourhood test on this one image and finds that with
  k = 10 the detached group of six tumour cells, about 375 um from the main tissue, is joined to
  it by kNN edges up to about 420 um long against a median nearest-neighbour distance of about
  16 um. The Treg-CD8T numbers for the legend come from a neighbourhood stated in micrometres
  without those edges (kNN capped at about 29 um, a radius of about 25 to 40 um, or the fragment
  removed): for example 23 observed versus about 9.4 expected neighbours on capped kNN, O/E about
  2.0 to 2.5 (log2 about 1.0 to 1.3), with a permutation p at its floor of 1/(m + 1) one-sided
  (0.001 with 999 permutations), never zero and never converted from the z-score. An interior-only
  sensitivity analysis (focal cells at least about 25 um inside the main tissue) keeps the
  enrichment (O/E about 3.4 to 4.7). NK-tumour avoidance is reported as not assessable with 4 NK
  cells, with no conclusion either way. The result is worded as co-localization in this one
  tissue, not as interaction or as a statement about other tumours.
context:
  scaffold_script: place-files.sh
