schema_version: "1.1"
name: responder-zscore-ttest-zh
expected_outcome: |
  The agent explains that the 30 ROIs are not 30 replicates: each patient's three ROIs are
  summarised per patient or modelled with a random patient intercept, so the comparison is 5
  versus 5 patients. It rejects comparing squidpy z-scores across ROIs because z grows with the
  number of cells and edges, and recommends a comparable effect size such as log2
  observed/expected contacts per ROI averaged within patient, or a cell-number-weighted mixed
  model. It requires correction across all 78 pairs and points out that with 5 versus 5
  patients an exact rank-based test cannot give a two-sided p below 2/252 (about 0.008), so few
  or no pairs can survive correction unless a small set of pairs is pre-specified. It states
  that a difference in spatial association is not evidence of cell-cell interaction, raises
  compartment confounding of the per-ROI null, and drafts a methods paragraph accordingly.
