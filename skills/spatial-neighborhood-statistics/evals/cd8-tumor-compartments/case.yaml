schema_version: "1.1"
name: cd8-tumor-compartments
expected_outcome: |
  The agent builds one neighbour graph per patient ROI in micrometres (pixel size 0.5 um, for
  example a 25 um radius, or kNN with the neighbour distance stated) and finds that CD8T-Tumor
  contacts are depleted in each of the four ROIs when labels are permuted over the whole ROI
  (log2 observed/expected roughly -0.7 to -1.1 at 25 um), but not when labels are permuted
  within the pathologist's Tumor and Stroma regions (log2 near 0, not significant), so the
  depletion reflects CD8 T cells sitting in stroma rather than local avoidance. A second
  neighbourhood definition (for example a 40 um radius or kNN with capped edges) gives the same
  pattern; a radius below the median nearest-neighbour distance (about 17 um) leaves most cells
  without neighbours and should not be used. It treats each patient as one replicate, reports
  four per-patient effects, notes that a two-sided sign test over 4 patients cannot go below
  0.125, and writes the result as compartment-level segregation, not as evidence of an
  exclusion mechanism, saying what more patients and orthogonal evidence would be needed.
context:
  scaffold_script: place-files.sh
