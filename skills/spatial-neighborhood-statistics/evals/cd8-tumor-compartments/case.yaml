schema_version: "1.1"
name: cd8-tumor-compartments
expected_outcome: |
  The agent builds one neighbour graph per patient ROI in micrometres (0.5 um per pixel), states
  the median nearest-neighbour distance (about 17 um) and keeps the primary radius or kNN edge cap
  above it, because at 17 um about half the cells have no neighbour. CD8T-Tumor contacts are
  depleted in all four ROIs when labels are permuted over the whole ROI (log2 observed/expected
  about -0.7 to -1.3) but not when labels are permuted within the pathologist's Tumor and Stroma
  regions. For each patient it gives the observed contacts with the expected count under both
  nulls (at 25 um, P1: 14 observed, about 26 expected over the whole ROI, about 11 within
  regions), so compartment composition accounts for about 80% to 130% of the deficit in every
  patient. The results paragraph keeps inference at the patient level (4 of 4 patients, exact
  two-sided sign test p = 0.125, the floor for four patients) and cites no p-value pooled across
  ROIs. The reply says a cohort-level claim needs at least six patients in one direction (6 of 6
  gives p = 0.031), describes the result as compartment-level segregation rather than avoidance
  or an exclusion mechanism, and names the data that could test a mechanism (barrier or ECM
  markers, CD8 functional state, perturbation experiments).
context:
  scaffold_script: place-files.sh
