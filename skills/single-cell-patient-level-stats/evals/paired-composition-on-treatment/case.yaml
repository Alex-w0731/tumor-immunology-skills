schema_version: "1.1"
name: paired-composition-on-treatment
expected_outcome: |
  The agent compares on-treatment with pre-treatment proportions within patients (signed-rank test on
  per-patient differences), notices that P6 has no on-treatment sample and leaves it out, so 5 pairs
  remain. It reports CD8_T higher on treatment in 5 of 5 pairs with an effect size of about 8
  percentage points (median and Hodges-Lehmann shift 0.081), explains that 5 pairs cannot give an
  exact two-sided p below 0.0625 (BH q-values are higher still, 0.19 for CD8_T across six cell
  types), and warns that the lower myeloid proportion is likely compositional: myeloid cell numbers
  barely change, and a log-ratio to a stable reference such as B cells shows no consistent shift. The
  suggested results sentence is exploratory and does not call any change significant, even though a
  paired t-test on the same proportions would give p of about 0.02 for CD8_T.
context:
  scaffold_script: place-files.sh
