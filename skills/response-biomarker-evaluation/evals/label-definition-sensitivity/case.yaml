schema_version: "1.1"
name: label-definition-sensitivity
expected_outcome: |
  The agent keeps the pre-treatment samples, defines responders as CR/PR and
  non-responders as SD/PD, and states that the 8 NE patients are excluded from the primary
  analysis but counted. It reports an AUC of about 0.82 with a 95% interval (roughly 0.68 to
  0.94) for 18 responders and 38 non-responders, and repeats the analysis with NE counted as
  non-responders (about 0.83), noting that this barely changes the result. It sets aside the 6
  on-treatment biopsies. It declines the co-author's suggestion to headline CR/PR versus PD with
  stable disease dropped (about 0.86), showing it at most as a labelled contrast of extremes that
  overstates discrimination. It explains that a single-arm cohort shows an association with
  response, not that the score predicts benefit from anti-PD-1, which would need validation and a
  comparator arm. The data file is synthetic.
context:
  scaffold_script: place-files.sh
