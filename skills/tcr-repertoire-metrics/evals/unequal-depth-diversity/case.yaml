schema_version: "1.1"
name: unequal-depth-diversity
expected_outcome: |
  The agent keeps productive TRB rows (five non-productive rows holding 108 reads are
  excluded), notices that tumour_A has 600 reads and tumour_B 150, and compares diversity at a
  common depth of 150 reads by repeated subsampling with a stated seed or by exact
  rarefaction. The written reply states that at that depth tumour_B has more clonotypes (85)
  than tumour_A (about 54; exact rarefaction 54.4, roughly 45 to 62 across repeats), reversing
  the raw comparison (195 versus 85), and that the ranking holds at a second, lower depth (at
  75 reads about 56 versus 30) or along rarefaction curves. It describes the spread across
  repeats as subsampling variation, not a confidence interval. Clonality is 1 minus Shannon
  entropy over the log of the number of clonotypes and is compared at 150 reads because it also
  moves with depth: tumour_A about 0.28 (0.36 at full depth) against tumour_B 0.02, so
  tumour_A is the more clonal sample. Chao1 is reported as a depth-dependent lower bound;
  tumour_A's large Chao1 (about 1,660 at full depth; about 900 on average at 150 reads,
  roughly 300 to 1,700 across repeats) rests on 180 singletons against 10 doubletons and is
  not taken as evidence that tumour_A is more diverse.
context:
  scaffold_script: place-files.sh
