schema_version: "1.1"
name: single-cell-pre-post
expected_outcome: |
  The agent analyses TRB (or each chain separately, or paired clonotypes) instead of pooling
  TRA and TRB contigs, keeps productive contigs only, and uses the number of distinct cells
  (barcodes) per clonotype as clone size: pre has 30 cells in 26 TRB clonotypes, post 80 cells
  in 37. Because cell numbers differ, post is subsampled to 30 cells with repeats and a seed.
  The written reply states that post then has about 17 clonotypes (exact rarefaction 17.05;
  roughly 13 to 21 across repeats) against 26 pre, explains that the higher raw count (37)
  comes from the larger number of cells, and says the ranking holds at a second, lower cell
  number (at 20 cells about 18 versus 12 clonotypes) or along rarefaction curves. Post also
  has lower Shannon entropy (about 2.4 versus 3.2) and higher clonality (about 0.15 versus
  0.02; 0.20 at full depth). The reply states the share of cells in expanded clonotypes (at
  least 2 cells) at both time points: 23% (7 of 30) before and 62.5% (50 of 80) after, about
  55% at 30 cells. It reports no p-value: with one patient and one sample per time point the
  change is descriptive. The answer is written in Chinese.
context:
  scaffold_script: place-files.sh
