schema_version: "1.1"
name: tcga-gene-purity-zh
expected_outcome: |
  The agent explains, in Chinese, that the matrix must be transposed to genes x samples and the
  versioned Ensembl IDs mapped to HGNC symbols before any symbol-based signature can be scored. It
  explains that a gene expressed mainly by tumour cells correlates negatively with immune scores
  through purity alone, recommends purity-adjusted partial correlations reported next to the raw
  ones with FDR control across signatures, and warns that ESTIMATE purity is itself built from
  immune and stromal gene expression, so adjusting immune scores for it partly removes the signal
  under study; it suggests ABSOLUTE or pathology purity, or a sensitivity analysis. It rejects the
  causal sentence and offers associational wording plus ways to test causality.
