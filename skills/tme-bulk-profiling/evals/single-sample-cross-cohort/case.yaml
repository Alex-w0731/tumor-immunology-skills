schema_version: "1.1"
name: single-sample-cross-cohort
expected_outcome: |
  The agent explains that z-scores are cohort-relative: run on the new biopsy alone, tmelens
  returns 0 for TIS_Ayers18 and every other signature, so that value carries no information. For
  the biopsy it recommends a description against the 40-tumour cohort held fixed (the mean log2
  expression of the TIS_Ayers18 genes placed as a percentile among the cohort's mean scores, or
  z-scores with the cohort's frozen gene means and SDs) rather than a joint re-run that would move
  all 40 existing scores, and it labels the result a research description. It states that a
  tmelens TIS_Ayers18 value is an unweighted summary of the 18 published genes, not the published
  clinical-grade T cell-inflamed GEP assay, so the Ayers et al. cut-off is not defined on it, and
  it declines to make a patient-level response call because the analysis is research use only.
  For the cohort comparison it explains that each separately z-scored cohort is centred on zero by
  construction, and that cohort and platform are completely confounded, so neither re-scoring with
  ssGSEA or another rank method nor batch correction such as ComBat can separate a biological
  difference from a platform effect. It proposes questions the data can answer: the same
  within-cohort association estimated in each cohort and shown side by side, or one common assay,
  such as CD8 immunohistochemistry, applied to samples from both cohorts.
