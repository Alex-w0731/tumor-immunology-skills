schema_version: "1.1"
name: tcga-prad-endpoint-zh
expected_outcome: |
  The agent replaces OS with the progression-free interval as the primary endpoint for
  TCGA-PRAD, citing the TCGA Pan-Cancer Clinical Data Resource (Liu et al. 2018): about 10 OS
  deaths against about 93 PFI events among about 500 patients. It replaces the per-cell-type
  surv_cutpoint search with prespecified Cox models that treat each fraction as a continuous
  variable (HR per 1 SD), and shows the cost of the search with a simulation for a cohort of
  this size: the best cut-off of a marker with no effect reaches p < 0.05 about 45% of the time
  (0.44 to 0.46 at 50% to 90% censoring in the bundled simulation). It applies
  Benjamini-Hochberg once across every cell type, endpoint and model it plans to test (22 for
  PFI alone, 44 with OS as well). It notes that about 93 PFI events, fewer after exclusions,
  support about 9 model parameters at 10 events per parameter. It adjusts for stage or Gleason
  grade group and for tumour purity, preferring a DNA-based purity estimate such as ABSOLUTE to
  an expression-based one such as ESTIMATE, which is built from immune and stromal genes, and
  proposes a sensitivity analysis for tissue source site. It keeps one primary-tumour sample per
  patient. The answer may be written in Chinese.
