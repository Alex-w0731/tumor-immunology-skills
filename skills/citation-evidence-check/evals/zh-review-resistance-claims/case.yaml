schema_version: "1.1"
name: zh-review-resistance-claims
expected_outcome: |
  The agent answers in Chinese after looking up all four references and reading their abstracts.
  Statement 1 is not supported: Zaretsky et al. analysed paired biopsies from four patients (JAK1
  or JAK2 loss-of-function mutations in two, a B2M truncating mutation in one), so the agent
  reports these counts without turning them into a percentage, and it gives no other figure for
  B2M-related resistance unless it looked up a source that contains it. Statement 2 overstates
  Gopalakrishnan et al.: the patient data are associations and the causal support comes from
  germ-free mice given patient faecal transplants, so the suggested wording drops 决定 and makes
  no causal claim about patients. Statement 3 cites PMID 30006565, which belongs to Duhen et al.
  (Nat Commun 2018); the identifier for Simoni et al., confirmed by a lookup, is PMID 29769722
  (doi:10.1038/s41586-018-0130-2), and its abstract supports the statement for lung and
  colorectal cancer only, so the wording is restricted to those cancers. Statement 4 cites a
  review whose abstract does not itself make the claim; the agent recommends primary clinical
  data for it.
