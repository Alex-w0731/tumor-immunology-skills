schema_version: "1.1"
name: wiki-report-doi-only
expected_outcome: |
  The agent resolves the four DOIs (identifiers only, so identity rests on comparing each
  registered record with its statement), reads the abstracts, and opens the full text where a
  statement depends on a number or a subgroup. The statements for references 1 and 2 are
  swapped: the CD103+CD39+ statement comes from Duhen et al. (Nat Commun 2018, the DOI given as
  reference 2) and the viral-epitope bystander statement from Simoni et al. (Nature 2018, the DOI
  given as reference 1). Even with the DOIs exchanged, the CD103+CD39+ statement overstates
  Duhen et al.: "six different malignancies" is where the subset was found, while tumour
  reactivity was tested with autologous tumour cells from melanoma and head and neck cancer
  patients, so that clause is narrowed or flagged. Reference 3 (Hossain et al., Immunity 2013)
  was retracted in 2021, so the FoxP3-STAT3 bullet is deleted or marked unverified, and no
  replacement is named unless it was looked up and read in this session. Reference 4 (Ayers et
  al. 2017) supports its statement. The uncited bullet on CD39-blocking antibodies in phase 1
  trials is deleted or marked unverified, with no trial or paper attached that was not looked up.
  The notice check is dated, so "no notice" for references 1, 2 and 4 holds as of that date.
context:
  scaffold_script: place-files.sh
