schema_version: "1.1"
name: grant-significance-agent-draft
expected_outcome: |
  The agent looks up all five references at Crossref or PubMed, reads the abstracts, and opens
  the full text where a number depends on it. Reference 1 exists, but the trial reports a
  cumulative objective response rate in non-small-cell lung cancer of 18% (14 of 76 evaluable
  patients), pooled across all doses (0.1 to 10.0 mg per kilogram), so the 40% figure is replaced
  with that rate and its dose scope. A statement that a paper does not report something rests on
  a full text the agent says it read; from the abstract alone it says "not in the abstract".
  Reference 2 supports its sentence. Reference 3 (Kurtulus et al. 2015) was retracted in July 2024
  (notice doi:10.1172/JCI183278). The DOI of reference 4 belongs to an unrelated 2021 Nature
  Immunology article on mentoring and no record matches the cited title, first author and year,
  so it is reported as probably fabricated. In the corrected paragraph the TIGIT and
  hepatocellular carcinoma sentences are deleted or marked unverified, not rewritten around
  papers that were not in the draft; any new source is offered outside the paragraph, labelled
  new and checked. Reference 5 is a mouse study, so the sentence about patients is narrowed to
  mouse models or flagged as needing a human source. The answer contains a corrected paragraph
  and a table of changes with reasons.
context:
  scaffold_script: place-files.sh
