schema_version: "1.1"
name: nnls-macrophage-split
expected_outcome: |
  The agent fits on linear-scale values (2^x - 1 of the log2(TPM+1) input), not on log values. The M1 and M2
  signature columns are nearly collinear (r about 0.90 after row scaling, about 0.98 unscaled; the script flags the
  pair) and the fit gives M2 a zero coefficient in all six tumours. IDO1 and CXCL9, the two most M1-weighted signature
  genes, carry the largest positive residuals in every tumour (about +0.90 and +0.48 row-scaled, a fit in which every
  other macrophage gene is over-fitted); refitting without them makes M2 non-zero in all six tumours and larger than M1 in
  R1, N2 and N3. The split therefore rests on expression the signature does not describe, such as tumour cells, and
  the agent reports total macrophages, with no M2 comparison, no M1/M2 ratio and no figure of either. On the linear
  scale the non-responders carry less immune signal (coefficient sum about 0.35-0.41 against 0.56-0.64), which the
  fractions, shares of the five signature cell types, hide: the macrophage share looks equal or higher in
  non-responders, but the macrophage coefficient is lower in each non-responder (about 0.18-0.23) than in each
  responder (about 0.25-0.30). The agent notes the three-versus-three design and recommends a purity estimate and
  validation of any split (mixtures of known composition, or IHC) before a figure. The input files are synthetic.
context:
  scaffold_script: place-files.sh
