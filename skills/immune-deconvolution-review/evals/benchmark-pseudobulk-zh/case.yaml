schema_version: "1.1"
name: benchmark-pseudobulk-zh
expected_outcome: |
  The agent scores the estimates with error metrics (for example with mixture_benchmark.py), not only correlations.
  It notices that the true fractions are shares of all cells (rows sum to 0.37-0.55 because tumour cells are
  included) while the estimates sum to 1 over the five immune types, and the reply gives a per-cell-type table of bias
  and RMSE on a common denominator. There B cells rank the mixtures almost perfectly (r about 0.997) but are
  overestimated by about 0.10 (slope about 1.38), so B-cell values may compare samples but are not fractions to
  report. Tregs are estimated at 0.030-0.039 (mean 0.035) in the four mixtures that contain none, which the agent
  turns into a rule that Treg estimates at or below about 0.04 mean not detected. Composition within mixtures is
  recovered poorly (per-sample r median about 0.84, as low as 0.44; B cells wrongly ranked first in 4 of 12
  mixtures), so within-sample claims such as which cell type dominates are unsupported. The benchmark is circular
  (reference and mixtures from the same cells) and measures background only for Tregs, so the redesign uses held-out
  patients and adds mixtures that lack each cell type. The agent does not endorse the sentence about validated
  accuracy for TCGA: a single-cell-derived reference needs an explicit cross-platform correction before use on bulk
  RNA-seq, which this benchmark cannot test, and an orthogonal check such as IHC or flow cytometry on a subset is
  needed. The answer may be written in Chinese. The input files are synthetic.
context:
  scaffold_script: place-files.sh
